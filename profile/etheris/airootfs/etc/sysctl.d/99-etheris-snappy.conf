# Etheris OS — snappy interactive feel (safe desktop defaults)
# Lower latency for UI; keep RAM policy in 99-etheris-ram.conf.
kernel.sched_autogroup_enabled = 1
vm.dirty_writeback_centisecs = 1500
vm.dirty_expire_centisecs = 3000
# Slightly prefer reclaiming cache over swapping interactive pages
vm.swappiness = 10
