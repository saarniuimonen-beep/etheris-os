# Etheris OS — NVIDIA DRM / Wayland gaming defaults.
# Harmless when NVIDIA modules are absent. Required for Sway/Gamescope/Steam
# on proprietary NVIDIA (modeset). Apply after installing nvidia / nvidia-open /
# nvidia-580xx, then rebuild initramfs and reboot.
options nvidia_drm modeset=1
options nvidia_drm fbdev=1
# Helps avoid black screens after suspend when nvidia-suspend units are present.
options nvidia NVreg_PreserveVideoMemoryAllocations=1
options nvidia NVreg_TemporaryFilePath=/var/tmp
