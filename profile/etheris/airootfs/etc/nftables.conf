#!/usr/sbin/nft -f
# Etheris OS — default host firewall (nftables)
# Policy: drop unsolicited inbound; allow established + loopback; allow outbound.
# DHCP/DNS/desktop traffic works via outbound + established/related.
# Do not claim this is a complete security boundary.

flush ruleset

table inet etheris_filter {
	chain input {
		type filter hook input priority filter; policy drop;

		iif "lo" accept
		ct state invalid drop
		ct state established,related accept

		# Path MTU / neighbor discovery (safe subset)
		ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } accept
		ip6 nexthdr ipv6-icmp icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, echo-request, nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept

		# Etheris file transfers — Warpinator (LAN send/receive)
		tcp dport { 42000, 42001 } accept
		udp dport 42000 accept
		# mDNS / Zeroconf discovery (Warpinator peers + Avahi)
		udp dport 5353 accept

		# No SSH / no extra listeners by default
		counter drop
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
