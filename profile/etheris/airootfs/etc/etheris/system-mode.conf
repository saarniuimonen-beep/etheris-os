# Etheris OS deployment mode (live ISO default)
# immutable-prep = installed Btrfs systems; /usr may be remounted read-only
# immutable-ab   = future A/B deployments (NOT ACTIVE)
# mutable-classic = normal writable Arch root (live + ext4 installs)

MODE=mutable-classic
IMMUTABLE_PLANNED=yes
DOCUMENTATION=/usr/local/share/etheris/docs/IMMUTABLE.md
