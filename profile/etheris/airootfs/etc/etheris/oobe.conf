# Etheris OS — first-boot OOBE policy (installed systems)
# Live ISO never runs OOBE (detected via /run/archiso).

# enabled=1 → installer may set /var/lib/etheris/oobe/state to "needed"
enabled=1

# Pages the wizard offers (installer-set values are review/skip)
page_keyboard=1
page_network=1
page_appearance=1
page_privacy=1
