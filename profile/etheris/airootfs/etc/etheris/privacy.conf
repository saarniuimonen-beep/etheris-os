# Etheris OS privacy defaults (Phase 19)
# These are policy statements enforced by configuration, not a guarantee of anonymity.

TELEMETRY=off
ANALYTICS=off
CRASH_REPORTS=off
LOG_UPLOAD=off
MANDATORY_ACCOUNTS=off
MANDATORY_CLOUD=off
ADVERTISING=off
DIAGNOSTICS=opt-in-only

# Live ISO may use a documented shared login for testing.
# Installed systems must use user-chosen passwords (never defaults).
LIVE_SHARED_LOGIN=documented_only
