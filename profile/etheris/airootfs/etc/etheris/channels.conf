# Etheris OS — update channels (Omarchy-inspired, Arch Archive based)
# No custom package mirror: we only retarget pacman at known-good snapshots.

# Default channel for new installs / live ISO
DEFAULT_CHANNEL=stable

# Stable: validated lagged snapshot (start at 2 weeks; may extend to 30)
STABLE_LAG_DAYS=14

# RC: closer to current Arch — for Etheris release candidates / testers
RC_LAG_DAYS=7

# Edge: official rolling Arch (no archive lag)
# EDGE_MIRROR can be overridden; default uses geo mirror
EDGE_MIRROR='https://geo.mirror.pkgbuild.com/$repo/os/$arch'

# When promoting security fixes on Stable/RC, jump to this many days behind "today"
# (still a coherent Archive snapshot — never mix random package dates)
SECURITY_LAG_DAYS=3

# AUR policy: refuse packages newer than this many days (aligned with Stable by default)
AUR_LAG_DAYS=14
