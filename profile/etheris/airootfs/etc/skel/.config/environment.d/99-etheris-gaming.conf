# Etheris gaming defaults (user session). Loaded by systemd --user / pam_env.
# Restart the session after first login for these to apply.
#
# Do NOT set SDL_VIDEODRIVER=x11 here — that poisons native Wayland games
# and Gamescope. etheris-steam sets X11 only for the Steam client process.
PROTON_LOG=0
# Controllers / Steam Input under Wayland (XWayland + native).
SDL_JOYSTICK_HIDAPI=1
