# Etheris OS — ReGreet login
# Live ISO: one user + one session — skip combos so focus lands on password.
skip_selection = true

[background]
path = "/usr/local/share/etheris/wallpapers/ocean-glass.png"
fit = "Cover"

[GTK]
application_prefer_dark_theme = true
cursor_theme_name = "Adwaita"
cursor_blink = false
font_name = "Noto Sans 13"
icon_theme_name = "Papirus-Dark"
theme_name = "Adwaita-dark"

[commands]
reboot = ["systemctl", "reboot"]
poweroff = ["systemctl", "poweroff"]

[appearance]
greeting_msg = "Etheris OS"

[widget.clock]
format = "%A, %e %B%n%H:%M"
resolution = "30s"
label_width = 280
justification = "center"
valign = "top"
halign = "center"
