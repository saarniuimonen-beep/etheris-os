# Etheris OS — mild PipeWire defaults (desktop + games).
# Keep quantum modest; do not force pro-audio buffer sizes on laptops.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 96000 ]
    # Slightly larger default quantum reduces crackle on virtio / weak CPUs.
    default.clock.quantum       = 1024
    default.clock.min-quantum   = 256
    default.clock.max-quantum   = 2048
}
