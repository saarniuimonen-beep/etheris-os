theme=ocean-glass
wallpaper=/usr/local/share/etheris/wallpapers/ocean-glass.png
wallpaper_mode=fill
accent=#38bdf8
blur=off
animations=off
theme_variant=dark
panel_layout=floating
shell=waybar
tray=panel
dnd=off
widgets=off
launcher_style=wide
timezone_auto=on
browser_preload=on
default_browser=firefox
performance_profile=balanced
# performance_profile=maximum|balanced|quiet|powersave — etheris-perf
# panel_layout=floating|dock  — floating = top Neo-Aero panel; dock = bottom island
# widgets=off|clock  — desktop clock off by default (WP-S5)
# tray=panel|off|cc  — panel shows StatusNotifier; cc hides tray (use Notifications/CC)
# launcher_style=wide|slim  — Kickoff width (Wide default · Slim compact)
# timezone_auto=on|off — update timezone when traveling to another country
# browser_preload=on|off — warm Firefox in scratchpad for <1s Super+B (uses ~300–450 MiB)
# default_browser=firefox — or set via etheris-browsers
# shell=quickshell  # Path B — only after ADR gates pass; never dual-panel
