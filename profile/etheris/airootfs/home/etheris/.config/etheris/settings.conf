theme=ocean-glass
wallpaper=/usr/local/share/etheris/wallpapers/ocean-glass.png
wallpaper_mode=fill
accent=#38bdf8
blur=off
animations=on
theme_variant=dark
panel_layout=floating
shell=waybar
tray=panel
dnd=off
widgets=off
launcher_style=slim
launcher_icons=on
timezone_auto=on
browser_preload=off
default_browser=firefox
performance_profile=balanced
# blur=on|off — frosted Menu/Session backdrop (one-shot grim+magick; not compositor blur)
# animations=on|off — overlay fade/rise; also GTK toolkit motion via theme-apply
# performance_profile=maximum|balanced|quiet|powersave — etheris-perf
# panel_layout=floating|dock  — floating = thin edge top bar; dock = bottom island
# widgets=off|clock  — desktop clock off by default (WP-S5)
# tray=panel|off|cc  — panel shows StatusNotifier; cc hides tray (use Notifications/CC)
# launcher_style=slim|wide  — Kickoff width (Slim default · Wide roomy)
# launcher_icons=on|off — app icon grid (on by default)
# timezone_auto=on|off — update timezone when traveling to another country
# browser_preload=off|on — default off so idle session_pss stays ≤500 MiB (docs/IDLE-RAM-CRITERIA.md).
# Session still runs `etheris-browser --preload` to prepare the lean profile; warm resident
# Firefox is opt-in (on) and must stay in scratchpad. Super+B always uses the lean profile.
# default_browser=firefox — or set via etheris-browsers
# shell=quickshell  # Path B — only after ADR gates pass; never dual-panel
