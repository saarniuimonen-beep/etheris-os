[config]
bm_open_method=0
su_cmd=xdg-su -c '%s'
mount_on_startup=1
mount_removable=1
autorun=1
media_in_new_tab=0
close_on_unmount=1
# Etheris uses Sway wallpaper — do not let PCManFM paint the desktop
[desktop]
wallpaper_mode=color
wallpaper=
desktop_bg=#0a1628
desktop_fg=#e8f4fc
desktop_shadow=#061018
show_wm_menu=0
show_documents=0
show_trash=1
show_mounts=1

[volume]
mount_on_startup=1
mount_removable=1
autorun=1

[ui]
always_show_tabs=0
hide_close_btn=0
win_width=980
win_height=620
splitter_pos=220
max_tab_chars=32
view_mode=icon
show_statusbar=1
pathbar_mode_buttons=0
