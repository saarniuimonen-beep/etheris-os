# Etheris OS — Hyprland defaults (edit freely)

monitor=,preferred,auto,1

env = XCURSOR_SIZE,24
env = MOZ_ENABLE_WAYLAND,1

exec-once = waybar
exec-once = mako
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = etheris apply-session

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(a78bfaee) rgba(67e8f9ee) 45deg
    col.inactive_border = rgba(334155aa)
    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = false
        size = 4
        passes = 1
    }
}

animations {
    enabled = true
    bezier = mist, 0.16, 1, 0.3, 1
    animation = windows, 1, 4, mist
    animation = fade, 1, 3, mist
    animation = workspaces, 1, 4, mist
}

dwindle {
    preserve_split = true
}

$input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# Session / power menu — fullscreen overlay, no chrome
windowrulev2 = float, class:^(os\.etheris\.PowerMenu)$
windowrulev2 = fullscreen, class:^(os\.etheris\.PowerMenu)$
windowrulev2 = noborder, class:^(os\.etheris\.PowerMenu)$
windowrulev2 = rounding 0, class:^(os\.etheris\.PowerMenu)$
windowrulev2 = noanim, class:^(os\.etheris\.PowerMenu)$
windowrulev2 = pin, class:^(os\.etheris\.PowerMenu)$

$mod = SUPER

bind = $mod, Return, exec, foot
bind = $mod, D, exec, fuzzel
bind = $mod, Space, exec, fuzzel
bind = $mod, Q, killactive
bind = $mod, M, exit
bind = $mod, L, exec, hyprlock || swaylock -f -c 0b1020
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = , Print, exec, grim - | wl-copy
bind = SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy

bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
