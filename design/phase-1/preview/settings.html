<!DOCTYPE html>
<html lang="en" data-atmosphere="ocean-glass">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings — Etheris Design Phase 1</title>
  <link rel="stylesheet" href="preview.css" />
  <style>
    .settings {
      position: absolute;
      inset: 64px 24px 24px;
      z-index: 20;
      display: grid;
      grid-template-columns: 220px 1fr;
      overflow: hidden;
      max-width: 960px;
      margin: 0 auto;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 48px);
    }
    .nav {
      padding: 18px 14px;
      border-right: 1px solid var(--eth-border);
      background: color-mix(in srgb, var(--eth-bg-elevated) 70%, transparent);
    }
    .nav h1 {
      margin: 0 0 12px;
      font-size: 18px;
      padding: 0 8px;
    }
    .nav a {
      display: block;
      padding: 10px 12px;
      border-radius: 10px;
      color: var(--eth-fg-muted);
      margin-bottom: 2px;
      font-size: 13px;
    }
    .nav a.on,
    .nav a:hover {
      background: var(--eth-accent-soft);
      color: var(--eth-fg);
    }
    .main {
      padding: 20px 24px;
      overflow: auto;
    }
    .main h2 {
      margin: 0 0 6px;
      font-size: 20px;
    }
    .main .lead {
      color: var(--eth-fg-muted);
      margin: 0 0 20px;
      font-size: 13px;
    }
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .theme-card {
      border-radius: 12px;
      border: 1px solid var(--eth-border);
      overflow: hidden;
      cursor: pointer;
      background: var(--eth-bg-elevated);
    }
    .theme-card.selected {
      border-color: var(--eth-accent);
      box-shadow: var(--eth-focus-ring);
    }
    .theme-card .swatch {
      height: 72px;
      background-size: cover;
      background-position: center;
    }
    .theme-card figcaption {
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 500;
    }
    .wall-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .wall-row button {
      aspect-ratio: 16/10;
      border-radius: 10px;
      border: 2px solid transparent;
      background-size: cover;
      cursor: pointer;
      padding: 0;
    }
    .wall-row button[aria-pressed="true"] {
      border-color: var(--eth-accent);
    }
    @media (max-width: 720px) {
      .settings { grid-template-columns: 1fr; inset: 56px 12px 12px; }
      .nav { border-right: 0; border-bottom: 1px solid var(--eth-border); display: flex; flex-wrap: wrap; gap: 4px; }
      .nav h1 { width: 100%; }
      .wall-row { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body class="stage-wrap">
  <div class="stage-bar">
    <nav>
      <a href="index.html">Hub</a>
      <a href="desktop.html">Desktop</a>
      <a href="launcher.html">Launcher</a>
      <a href="control-center.html">Control Center</a>
      <a href="settings.html" aria-current="page">Settings</a>
      <a href="login.html">Login</a>
      <a href="atmospheres.html">Atmospheres</a>
      <a href="extras.html">Extras</a>
    </nav>
    <div class="atm-picker">
      <button type="button" data-atm="ocean-glass">Ocean</button>
      <button type="button" data-atm="aurora">Aurora</button>
      <button type="button" data-atm="meadow">Meadow</button>
      <button type="button" data-atm="arctic-glow">Arctic</button>
      <button type="button" data-atm="midnight-ocean">Midnight</button>
    </div>
  </div>

  <div class="stage">
    <section class="glass settings pop" aria-label="Settings">
      <aside class="nav">
        <h1>Settings</h1>
        <input class="input" type="search" placeholder="Search settings" style="margin-bottom:12px" />
        <a href="#">Network</a>
        <a href="#">Bluetooth</a>
        <a href="#">Displays</a>
        <a href="#">Sound</a>
        <a class="on" href="#">Personalisation</a>
        <a href="#">Privacy</a>
        <a href="#">About</a>
      </aside>
      <div class="main">
        <h2>Personalisation</h2>
        <p class="lead">Atmosphere, accent, and wallpaper — same Etheris geometry everywhere.</p>

        <h3 style="font-size:14px;margin:0 0 10px">Atmosphere</h3>
        <div class="theme-grid">
          <figure class="theme-card selected" data-pick="ocean-glass">
            <div class="swatch" style="background-image:url(assets/ocean-glass.svg)"></div>
            <figcaption>Ocean Glass</figcaption>
          </figure>
          <figure class="theme-card" data-pick="aurora">
            <div class="swatch" style="background-image:url(assets/aurora.svg)"></div>
            <figcaption>Aurora</figcaption>
          </figure>
          <figure class="theme-card" data-pick="meadow">
            <div class="swatch" style="background-image:url(assets/meadow.svg)"></div>
            <figcaption>Meadow</figcaption>
          </figure>
          <figure class="theme-card" data-pick="arctic-glow">
            <div class="swatch" style="background-image:url(assets/arctic-glow.svg)"></div>
            <figcaption>Arctic Glow</figcaption>
          </figure>
          <figure class="theme-card" data-pick="midnight-ocean">
            <div class="swatch" style="background-image:url(assets/midnight-ocean.svg)"></div>
            <figcaption>Midnight Ocean</figcaption>
          </figure>
        </div>

        <h3 style="font-size:14px;margin:0 0 10px">Wallpaper</h3>
        <div class="wall-row" id="walls">
          <button type="button" style="background-image:url(assets/ocean-glass.svg)" data-atm="ocean-glass" aria-pressed="true" aria-label="Ocean Glass"></button>
          <button type="button" style="background-image:url(assets/aurora.svg)" data-atm="aurora" aria-pressed="false" aria-label="Aurora"></button>
          <button type="button" style="background-image:url(assets/meadow.svg)" data-atm="meadow" aria-pressed="false" aria-label="Meadow"></button>
          <button type="button" style="background-image:url(assets/arctic-glow.svg)" data-atm="arctic-glow" aria-pressed="false" aria-label="Arctic Glow"></button>
          <button type="button" style="background-image:url(assets/midnight-ocean.svg)" data-atm="midnight-ocean" aria-pressed="false" aria-label="Midnight Ocean"></button>
        </div>

        <div style="margin-top:24px;display:flex;gap:12px;align-items:center">
          <span style="font-size:13px;color:var(--eth-fg-muted)">Reduced transparency</span>
          <button type="button" class="toggle" aria-label="Reduced transparency" onclick="document.documentElement.setAttribute('data-transparency', this.classList.toggle('on')?'reduced':'');this.setAttribute('aria-pressed', this.classList.contains('on'))"></button>
        </div>
      </div>
    </section>
  </div>
  <script src="stage.js"></script>
  <script>
    document.querySelectorAll(".theme-card").forEach((card) => {
      card.addEventListener("click", () => {
        document.querySelectorAll(".theme-card").forEach((c) => c.classList.remove("selected"));
        card.classList.add("selected");
        const name = card.dataset.pick;
        document.documentElement.setAttribute("data-atmosphere", name);
        localStorage.setItem("eth-atmosphere", name);
        document.querySelectorAll("#walls button").forEach((b) => {
          b.setAttribute("aria-pressed", b.dataset.atm === name ? "true" : "false");
        });
      });
    });
    document.querySelectorAll("#walls button").forEach((btn) => {
      btn.addEventListener("click", () => {
        const name = btn.dataset.atm;
        document.documentElement.setAttribute("data-atmosphere", name);
        localStorage.setItem("eth-atmosphere", name);
        document.querySelectorAll("#walls button").forEach((b) => {
          b.setAttribute("aria-pressed", b === btn ? "true" : "false");
        });
        document.querySelectorAll(".theme-card").forEach((c) => {
          c.classList.toggle("selected", c.dataset.pick === name);
        });
      });
    });
  </script>
</body>
</html>
