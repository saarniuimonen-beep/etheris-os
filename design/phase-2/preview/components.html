<!DOCTYPE html>
<html lang="en" data-atmosphere="ocean-glass">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Components — Etheris Phase 2</title>
  <link rel="stylesheet" href="preview.css" />
  <style>
    .page { padding:24px; max-width:900px; margin:0 auto; }
    .block { padding:20px; margin-bottom:16px; }
    .row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin:12px 0; }
    h2 { margin:0 0 8px; font-size:16px; }
  </style>
</head>
<body class="hub-body">
  <div class="stage-bar">
    <nav>
      <a href="index.html">Hub</a> <a href="desktop.html">Desktop</a> <a href="launcher.html">Launcher</a> <a href="control-center.html">Control Center</a> <a href="settings.html">Settings</a> <a href="login.html">Login</a> <a href="atmospheres.html">Atmospheres</a> <a href="components.html" aria-current="page">Components</a> <a href="experience.html">Experience</a>
    </nav>
    <div class="atm-picker" aria-label="Atmosphere">
      <button type="button" data-atm="ocean-glass">Ocean</button>
      <button type="button" data-atm="aurora">Aurora</button>
      <button type="button" data-atm="meadow">Meadow</button>
      <button type="button" data-atm="arctic-glow">Arctic</button>
      <button type="button" data-atm="midnight-ocean">Midnight</button>
    </div>
  </div>
  <div class="page">
    <h1 style="margin:0 0 8px">Component library</h1>
    <p style="color:var(--eth-fg-muted);margin:0 0 20px">Shared states: hover, focus-visible, pressed, selected, disabled, error.</p>
    <section class="glass block">
      <h2>Buttons</h2>
      <div class="row">
        <button class="btn btn-primary">Primary</button>
        <button class="btn btn-ghost">Ghost</button>
        <button class="btn btn-danger">Danger</button>
        <button class="btn btn-primary" disabled>Disabled</button>
      </div>
    </section>
    <section class="glass block">
      <h2>Input</h2>
      <input class="input" placeholder="Placeholder" style="max-width:360px" />
      <input class="input" value="Error example" style="max-width:360px;margin-top:8px;border-color:var(--eth-danger)" />
      <div style="font-size:12px;color:var(--eth-danger);margin-top:4px">Helper error text</div>
    </section>
    <section class="glass block">
      <h2>Toggle &amp; slider</h2>
      <div class="row">
        <button type="button" class="toggle on" aria-pressed="true" onclick="this.classList.toggle('on')"></button>
        <input class="slider" type="range" value="50" style="max-width:220px" />
      </div>
    </section>
    <section class="glass block">
      <h2>Notification toast</h2>
      <div style="display:flex;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--eth-border);background:var(--eth-highlight);max-width:360px">
        <div style="width:3px;border-radius:2px;background:var(--eth-accent)"></div>
        <div><strong style="font-size:13px">Update ready</strong><div style="font-size:12px;color:var(--eth-fg-muted)">Security snapshot available</div></div>
      </div>
    </section>
  </div>
  <script src="stage.js"></script>
</body>
</html>
